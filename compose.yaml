services:
  site:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/site.sqlite
    volumes:
      - site-data:/app/data
    restart: unless-stopped
  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped
volumes:
  site-data:
  caddy-data:
