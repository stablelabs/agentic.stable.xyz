name: Publish npm packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-wallet-npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'stablelabs/agentic.stable.xyz' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      WRANGLER_SEND_METRICS: 'false'
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
          cache: false

      - run: npm ci
      - name: Validate release versions and dependencies
        run: npm run release:check -- --tag "$RELEASE_TAG"
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:contracts
      - run: npm run test:browser
      - run: npm run build:cloudflare

      - name: Dry run (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm run release:publish -- --dry-run

      - name: Publish SDK, then CLI, and verify public installation
        if: github.event_name == 'push'
        run: npm run release:publish -- --tag "$RELEASE_TAG"
